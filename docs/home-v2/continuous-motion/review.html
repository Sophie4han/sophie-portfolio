<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>Chooni 연속 이동 검토</title><style>body{margin:32px;background:#f7f6f1;color:#242621;font:16px system-ui}video{display:block;width:100%;max-width:1200px}button{padding:10px 16px;margin:12px 8px 20px 0;cursor:pointer}section{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px;max-width:1200px}img{width:100%}figure{margin:0}figcaption{padding:8px 0}</style><h1>Chooni 연속 이동</h1><p>실제 브라우저 녹화 · 경로 유지 · 이동 3.6초</p><video id="recording" controls preload="auto" poster="capture-start.png" src="chooni-continuous.webm"></video><button id="back">0.5초 뒤로</button><button id="next">0.5초 앞으로</button><button id="play">처음부터 재생</button><h2>약 0.5초 간격 연속 캡처</h2><section id="frames"></section><script>const v=document.querySelector('video');document.querySelector('#back').onclick=()=>{v.pause();v.currentTime=Math.max(0,v.currentTime-.5)};document.querySelector('#next').onclick=()=>{v.pause();v.currentTime+=.5};document.querySelector('#play').onclick=()=>{v.currentTime=0;v.play()};for(let i=0;i<8;i++){const figure=document.createElement('figure');const image=document.createElement('img');image.src=`half-${i}.png`;image.alt=`이동 중 ${i*.5}초 부근`;image.onerror=()=>figure.remove();const caption=document.createElement('figcaption');caption.textContent=`약 ${i*.5}초`;figure.append(image,caption);document.querySelector('#frames').append(figure)}</script></html>
